name: Validate Agent Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install jsonschema PyYAML
      - name: Validate plugins/siglata
        run: python scripts/validate-plugin.py plugins/siglata
